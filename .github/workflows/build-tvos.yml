name: Build tvOS (test)

# App Apple TV, encore en test : construite à part de l'app iPhone (un échec
# ici ne bloque ni ses builds ni ses notes de version), sans signature, et
# publiée en pré-version « tv-test-N ». Les fichiers partagés avec l'iPhone
# ne la déclenchent pas tous : la lancer à la main (workflow_dispatch) après
# un gros changement dans Sources/Services.
# Chaque build a ses notes (lignes « Changelog: Apple TV: … » des commits
# qui touchent la TV) et met à jour apps-tv.json, une source au format
# AltStore : ATVLoadly (ou un autre outil) y trouve la dernière version et
# se met à jour seul — l'URL GitHub ne convient pas, les IPA de l'iPhone et
# de la TV étant dans les mêmes releases.
#
# Sur master (« push sur main ») : version stable « tv-N », release normale
# jamais marquée « Latest » (le lien « latest » de l'IPA iPhone doit rester
# le sien), et sa propre source, apps-tv-stable.json sur master — un autre
# fichier que celui des tests, pour que les fusions de la branche de test
# n'entrent jamais en conflit avec les mises à jour de la source stable.
on:
  push:
    branches:
      - test-17d298
      - master
    paths:
      - 'TV/**'
      - 'project.yml'
      - '.github/workflows/build-tvos.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-tvos:
    name: Build tvOS app
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet : notes depuis le build précédent.
          fetch-depth: 0

      - name: Channel
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "tag=tv-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "source=apps-tv-stable.json" >> $GITHUB_OUTPUT
          else
            echo "channel=test" >> $GITHUB_OUTPUT
            echo "tag=tv-test-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "source=apps-tv.json" >> $GITHUB_OUTPUT
          fi

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      # Jeton de comptage (/stats) : comme l'iPhone, seul le build officiel le
      # porte (secret PING_KEY, vide dans un fork) ; TVUsage l'envoie au Worker.
      - name: Inject usage ping key
        env:
          PING_KEY: ${{ secrets.PING_KEY }}
        run: plutil -replace TUPingKey -string "$PING_KEY" TV/Info.plist

      - name: Build tvOS app (unsigned)
        run: |
          mkdir -p build
          set +e
          xcodebuild -project TwitchUnblock.xcodeproj \
            -scheme TwitchUnblockTV \
            -configuration Release \
            -derivedDataPath build/DD \
            -destination 'generic/platform=tvOS' \
            -skipPackagePluginValidation \
            clean build \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1
          STATUS=$?
          set -e
          # Les erreurs de compilation, lisibles directement dans le journal.
          grep -E "error:" build/xcodebuild.log | sort -u | head -80 || true
          tail -n 5 build/xcodebuild.log
          exit $STATUS

      - name: Package IPA
        run: |
          APP=build/DD/Build/Products/Release-appletvos/TwitchUnblockTV.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr TwitchUnblockTV.ipa Payload
          ls -la TwitchUnblockTV.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwitchUnblockTV-IPA
          path: TwitchUnblockTV.ipa

      - name: Changelog since previous TV build
        env:
          SOURCE: ${{ steps.vars.outputs.source }}
        run: |
          # Commits qui touchent la TV depuis le build précédent du même canal
          # (commit gardé dans sa source) : leurs lignes « Changelog: Apple
          # TV: … », en anglais ; un commit sans elles compte dans « Other
          # improvements and fixes ». Les commits automatiques « [skip ci] »
          # sont ignorés.
          python3 - <<'PY'
          import json, os, subprocess
          prev = None
          try:
              prev = json.load(open(os.environ['SOURCE'], encoding='utf-8'))['apps'][0]['versions'][0].get('commit')
          except Exception:
              pass
          def is_ancestor(c):
              return subprocess.run(['git', 'merge-base', '--is-ancestor', c, 'HEAD'], capture_output=True).returncode == 0
          args = ['git', 'log', '--no-merges', '--format=%H%x1f%s%x1f%b%x1e']
          args += [f'{prev}..HEAD'] if prev and is_ancestor(prev) else ['-n', '6']
          args += ['--', 'TV', 'project.yml']
          out = subprocess.run(args, capture_output=True, text=True, encoding='utf-8').stdout
          lines, other = [], 0
          for rec in out.split('\x1e'):
              if not rec.strip():
                  continue
              sha, _, rest = rec.strip('\n').partition('\x1f')
              subject, _, body = rest.partition('\x1f')
              if '[skip ci]' in subject:
                  continue
              custom = [l.split(':', 1)[1].strip() for l in body.splitlines() if l.lower().startswith('changelog:')]
              tv = [c.split(':', 1)[1].strip() for c in custom if c.lower().startswith('apple tv:')]
              if not tv:
                  other += 1
                  continue
              for item in tv:
                  item = item[:1].upper() + item[1:]
                  if item and item not in lines:
                      lines.append(item)
          items = lines[:30]
          if other and len(items) < 30:
              items.append('Other improvements and fixes')
          notes = '\n'.join(f'- {l}' for l in items) or '- Improvements and fixes'
          open('tv-changelog.md', 'w', encoding='utf-8').write(notes + '\n')
          print(notes)
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STABLE=$([ "${{ steps.vars.outputs.channel }}" = "stable" ] && echo 1 || echo 0)
          {
            cat tv-changelog.md
            echo
            if [ "$STABLE" = 1 ]; then
              echo 'Apple TV build (unsigned), built from the `master` branch.'
              echo
              echo '**Automatic updates**: add this source in ATVLoadly (or another tool that reads AltStore sources):'
              echo 'https://raw.githubusercontent.com/MXFia19/TwitchUnblock/master/apps-tv-stable.json'
            else
              echo 'Apple TV test build (unsigned), built from the `test-17d298` branch.'
              echo
              echo '**Automatic updates**: add this source in ATVLoadly (or another tool that reads AltStore sources):'
              echo 'https://raw.githubusercontent.com/MXFia19/TwitchUnblock/test-17d298/apps-tv.json'
            fi
            echo
            echo '**With Xcode**: pair the Apple TV with a Mac (Xcode → Window → Devices and Simulators), run'
            echo '`brew install xcodegen` then `xcodegen generate` in the repository, open `TwitchUnblock.xcodeproj`,'
            echo 'pick the **TwitchUnblockTV** target and your team in Signing & Capabilities, then Run on the Apple TV.'
            echo 'With a free Apple account, the app expires after 7 days.'
          } > notes.md
          if [ "$STABLE" = 1 ]; then
            # Jamais « Latest » : releases/latest doit rester l'IPA de l'iPhone.
            gh release create "${{ steps.vars.outputs.tag }}" TwitchUnblockTV.ipa --latest=false \
              --target "${{ github.sha }}" \
              --title "TwitchUnblock TV 0.1.${{ github.run_number }}" \
              --notes-file notes.md
          else
            gh release create "${{ steps.vars.outputs.tag }}" TwitchUnblockTV.ipa --prerelease \
              --target "${{ github.sha }}" \
              --title "TwitchUnblock TV 0.1.${{ github.run_number }} (test)" \
              --notes-file notes.md
          fi

      - name: Update TV source (apps-tv.json / apps-tv-stable.json)
        env:
          VERSION: 0.1.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
          URL: https://github.com/MXFia19/TwitchUnblock/releases/download/${{ steps.vars.outputs.tag }}/TwitchUnblockTV.ipa
          SOURCE: ${{ steps.vars.outputs.source }}
          CHANNEL: ${{ steps.vars.outputs.channel }}
        run: |
          DATE=$(date -u +%Y-%m-%d) IPA_SIZE=$(stat -f%z TwitchUnblockTV.ipa) python3 - <<'PY'
          import json, os, subprocess
          src = os.environ['SOURCE']
          stable = os.environ['CHANNEL'] == 'stable'
          icon = 'https://raw.githubusercontent.com/MXFia19/TwitchUnblock/master/assets/icon.png'
          try:
              d = json.load(open(src, encoding='utf-8'))
          except Exception:
              d = {
                  'name': 'TwitchUnblock TV',
                  'subtitle': 'Apple TV builds of TwitchUnblock' if stable else 'Apple TV test builds of TwitchUnblock',
                  'description': ('Unsigned builds of the TwitchUnblock Apple TV app, released with the iPhone app. ' if stable
                                  else 'Unsigned test builds of the TwitchUnblock Apple TV app, from the test-17d298 branch. ')
                                 + 'Add this source in ATVLoadly (or any tool that reads AltStore sources) to get updates automatically.',
                  'iconURL': icon,
                  'website': 'https://github.com/MXFia19/TwitchUnblock',
                  'tintColor': '#9146ff',
                  'featuredApps': ['com.mxfia19.TwitchUnblockTV'],
                  'apps': [{
                      'name': 'TwitchUnblock TV',
                      'bundleIdentifier': 'com.mxfia19.TwitchUnblockTV',
                      'developerName': 'MXFia19',
                      'subtitle': 'Twitch lives and VODs on Apple TV' + ('' if stable else ' (test)'),
                      'localizedDescription': 'Followed channels, top streams, categories and search, lives and VODs with the chat on the picture.',
                      'iconURL': icon,
                      'tintColor': '#9146ff',
                      'category': 'entertainment',
                      'screenshots': [],
                      'appPermissions': {'entitlements': [], 'privacy': {}},
                      'versions': [],
                  }],
              }
          a = d['apps'][0]
          entry = {
              'version': os.environ['VERSION'], 'buildVersion': os.environ['BUILD'],
              'date': os.environ['DATE'], 'localizedDescription': open('tv-changelog.md', encoding='utf-8').read().strip(),
              'downloadURL': os.environ['URL'], 'size': int(os.environ['IPA_SIZE']),
              'commit': subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True).stdout.strip(),
          }
          a.update(version=entry['version'], versionDate=entry['date'], downloadURL=entry['downloadURL'], size=entry['size'])
          a['versions'] = [entry] + [v for v in a.get('versions', []) if v.get('buildVersion') != entry['buildVersion']][:19]
          json.dump(d, open(src, 'w', encoding='utf-8'), indent=2, ensure_ascii=False)
          open(src, 'a', encoding='utf-8').write('\n')
          PY

          # Seules la branche de test (apps-tv.json) et master
          # (apps-tv-stable.json) publient leur source ; un build lancé à la
          # main ailleurs s'arrête là.
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "test-17d298" ] && [ "$BRANCH" != "master" ]; then
            echo "Branche $BRANCH : source TV laissée telle quelle."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: TV source $VERSION [skip ci]"
            # Branche bougée pendant le build (version de l'iPhone…) : on
            # rejoue par-dessus au lieu d'échouer sur une course bénigne.
            # --autostash : Info.plist (jeton) et le projet généré sont modifiés
            # dans ce dossier, et bloquaient sinon la reprise.
            git push origin HEAD:$BRANCH || {
              git pull --rebase --autostash origin $BRANCH && git push origin HEAD:$BRANCH
            }
          fi
