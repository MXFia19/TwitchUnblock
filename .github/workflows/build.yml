name: Build and upload nightly

on:
  push:
    branches:
      - master
      # Branche de test : build à part (app « TU Test », release marquée
      # pré-version, source apps-test.json). L'app normale lit apps.json sur
      # master et ne voit donc jamais ces builds.
      - test-17d298
    # Nouvelle version seulement si l'app elle-même change : un README, la
    # source apps.json, auth.html ou le dossier worker ne déclenchent rien.
    paths:
      - 'Sources/**'
      - 'Shared/**'
      - 'Widgets/**'
      - 'Info.plist'
      - 'project.yml'
      - 'VERSION'
      - 'buildipa.sh'
      - 'assets/icon.png'
      - 'assets/icons/**'
      # Pas build.yml : une modification de la CI seule publiait un « nouveau »
      # build sous le même numéro de version (lancement à la main pour l'essayer).
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Un build à la fois par branche : deux builds rapprochés réécrivaient la même
# source en même temps. Celui en cours finit ; un build en attente est remplacé
# par le plus récent (qui contient tout).
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build iOS IPA
    # Xcode 27.1 (SDK iOS 27.1, Xcode par défaut de cette image GitHub, encore
    # en préversion) : sur l'écran intérieur de l'iPhone Duo, une app liée à
    # un SDK d'avant iOS 27 reste dans un cadre noir à la taille d'un iPhone ;
    # avec le SDK iOS 27.1, elle prend tout l'écran. macos-latest donnait
    # Xcode 26.6. Le minimum d'iOS 16 reste accepté (Xcode 27 : iOS 15 et plus).
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : sert à numéroter la version

      - name: Define Release Variables
        id: vars
        run: |
          # Version lisible : « MAJEUR.MINEUR » vient du fichier VERSION (à
          # modifier à la main pour passer à 1.2, 2.0…), le dernier chiffre
          # compte les builds depuis ce changement (commits automatiques
          # « [skip ci] » exclus). Il repart de 0 à chaque nouvelle série au
          # lieu de grimper sans fin (1.0.367). Le numéro de build interne
          # (CFBundleVersion) reste github.run_number : toujours croissant,
          # c'est lui qui sert à détecter une mise à jour.
          BASE=$(tr -d ' \n\r' < VERSION 2>/dev/null || echo "1.0")
          SINCE=$(git log -1 --format=%H -- VERSION)
          if [ -n "$SINCE" ]; then
            # Seuls les commits qui touchent l'app comptent (pas les README…),
            # sans les fusions : sur master, les anciennes fusions de la
            # branche de test comptaient (1.4.10 au lieu de 1.4.0).
            PATCH=$(git rev-list --count --no-merges "$SINCE"..HEAD -- Sources Shared Widgets Info.plist project.yml buildipa.sh assets/icon.png assets/icons)
          else
            PATCH=${{ github.run_number }}
          fi
          NEW_VERSION="$BASE.$PATCH"
          if [ "${{ github.ref_name }}" = "master" ]; then
            CHANNEL=stable; TAG_NAME="nightly-${{ github.run_number }}"; SOURCE=apps.json
          else
            CHANNEL=test;   TAG_NAME="test-${{ github.run_number }}";    SOURCE=apps-test.json
          fi
          BUILD_DATE=$(date -u +%Y-%m-%d)
          DOWNLOAD_URL="https://github.com/MXFia19/TwitchUnblock/releases/download/$TAG_NAME/TwitchUnblock.ipa"

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

      - name: Create App Icon Folder
        run: |
          echo "--- Icône iOS par défaut et aperçus des icônes au choix ---"
          CAT=Sources/Assets.xcassets
          # Une icône : normale, sombre et teintée (iOS 18+ ; iOS 26 tire aussi
          # ses icônes transparentes de la version teintée). $1 : catalogue,
          # $2 : image normale, $3 : préfixe des variantes dans assets/icons.
          make_icon() {
          dir="$CAT/$1.appiconset"
          mkdir -p "$dir"
          cp "$2" "$dir/icon.png"
          cp "assets/icons/$3-dark.png" "$dir/icon-dark.png"
          cp "assets/icons/$3-tinted.png" "$dir/icon-tinted.png"
          cat <<EOF > "$dir/Contents.json"
          {
            "images" : [
              { "filename" : "icon.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" },
              { "appearances" : [ { "appearance" : "luminosity", "value" : "dark" } ],
                "filename" : "icon-dark.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" },
              { "appearances" : [ { "appearance" : "luminosity", "value" : "tinted" } ],
                "filename" : "icon-tinted.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          }
          # Aperçu pour Réglages → Apparence → Icône de l'app.
          make_preview() {
          dir="$CAT/IconPreview-$1.imageset"
          mkdir -p "$dir"
          cp "assets/icons/previews/$1.png" "$dir/preview.png"
          cat <<EOF > "$dir/Contents.json"
          {
            "images" : [ { "filename" : "preview.png", "idiom" : "universal" } ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF
          }
          make_icon AppIcon assets/icon.png AppIcon
          make_preview Default
          # Icônes au choix : fichiers séparés, ajoutés à l'app par buildipa.sh.
          for name in Purple Night Light Contrast Neon; do
            make_preview "$name"
          done

      - name: Inject XcodeGen Settings
        run: |
          echo "--- Préparation du project.yml pour l'icône ---"
          if [ -f "project.yml" ]; then
            # Ancré en fin de ligne : sans `$`, la cible TwitchUnblockWidgets
            # (même début de nom) recevait aussi ces réglages, et son nom.
            sed -i '' "s/PRODUCT_NAME: TwitchUnblock$/PRODUCT_NAME: TwitchUnblock\n        MARKETING_VERSION: ${{ steps.vars.outputs.version }}\n        CURRENT_PROJECT_VERSION: ${{ github.run_number }}\n        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon/g" project.yml
            # Build de test : identifiant à part, installé à côté de l'app normale.
            # L'extension suit : son identifiant doit commencer par celui de l'app.
            if [ "${{ steps.vars.outputs.channel }}" = "test" ]; then
              sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock$/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock.test/" project.yml
              sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock.Widgets$/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock.test.Widgets/" project.yml
            fi
          fi

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Post-Generation Fix (Anti-Black Bars, Identity & PiP)
        env:
          # Secret du dépôt officiel, non hérité par les forks : seul le build
          # officiel porte ce jeton, et le Worker ne compte que les pings qui le
          # présentent. Vide si le secret n'est pas défini → build non compté.
          PING_KEY: ${{ secrets.PING_KEY }}
        run: |
          echo "--- Fix Info.plist (Plein écran, ID, Version, PiP) ---"
          # L'Info.plist de l'app seulement. Avant, `find . -name Info.plist`
          # les prenait tous : celui de l'extension des Live Activities aurait
          # reçu l'identifiant de l'app, et iOS refuse alors l'installation.
          APP_PLIST=./Info.plist
          EXT_PLIST=./Widgets/Info.plist
          # Identifiants et version
          if [ "${{ steps.vars.outputs.channel }}" = "test" ]; then
            plutil -replace CFBundleIdentifier -string "com.mxfia19.TwitchUnblock.test" "$APP_PLIST"
            plutil -replace CFBundleDisplayName -string "TU Test" "$APP_PLIST"
            # Son propre schéma de lien : avec le même que l'app, iOS ouvrait
            # l'une ou l'autre au toucher d'une notification ntfy.
            plutil -replace CFBundleURLTypes.0.CFBundleURLSchemes.0 -string "twitchunblock-test" "$APP_PLIST"
            plutil -replace CFBundleURLTypes.0.CFBundleURLName -string "com.mxfia19.TwitchUnblock.test" "$APP_PLIST"
          else
            plutil -replace CFBundleIdentifier -string "com.mxfia19.TwitchUnblock" "$APP_PLIST"
          fi
          # Canal lu par l'app : source de mises à jour (apps.json ou apps-test.json).
          plutil -replace TUChannel -string "${{ steps.vars.outputs.channel }}" "$APP_PLIST"
          # Même version pour l'app et son extension (iOS l'exige).
          for P in "$APP_PLIST" "$EXT_PLIST"; do
            plutil -replace CFBundleShortVersionString -string "${{ steps.vars.outputs.version }}" "$P"
            plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$P"
          done
          plutil -replace CFBundleIconName -string "AppIcon" "$APP_PLIST"

          # Jeton de comptage, seulement sur le build officiel (secret absent
          # des forks). Vide si non défini : le build n'est alors pas compté.
          plutil -replace TUPingKey -string "$PING_KEY" "$APP_PLIST"

          # Force le plein écran sans bandes noires
          plutil -remove UILaunchStoryboardName "$APP_PLIST" || true
          plutil -replace UILaunchScreen -xml "<dict/>" "$APP_PLIST"

          # ✨ RÉPARATION DU PIP ET DE L'AUDIO EN ARRIÈRE-PLAN
          plutil -replace UIBackgroundModes -json '["audio","fetch"]' "$APP_PLIST"

      - name: Make build script executable
        run: chmod +x ./buildipa.sh

      - name: Build iOS IPA
        run: ./buildipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwitchUnblock-Nightly-IPA
          path: build/TwitchUnblock.ipa

      - name: Changelog since previous build
        env:
          SOURCE: ${{ steps.vars.outputs.source }}
        run: |
          # Notes de version : les commits qui touchent l'app depuis le build
          # précédent de ce canal (commit gardé dans la source). En anglais —
          # la communauté l'est surtout, et le bot Discord les reprend : seules
          # les lignes « Changelog: … » du corps des commits sont listées ; un
          # commit sans elles (titre en français) compte dans « Other
          # improvements and fixes ». Les commits automatiques « [skip ci] »
          # sont ignorés, ainsi que ceux listés dans .github/changelog-ignore
          # (une fonction ajoutée puis retirée ne doit pas être annoncée).
          python3 - <<'PY'
          import json, os, subprocess
          src = os.environ['SOURCE']
          prev = None
          try:
              prev = json.load(open(src))['apps'][0]['versions'][0].get('commit')
          except Exception:
              pass
          ignored = []
          try:
              ignored = [l.split()[0] for l in open('.github/changelog-ignore')
                         if l.strip() and not l.lstrip().startswith('#')]
          except FileNotFoundError:
              pass
          def is_ancestor(c):
              return subprocess.run(['git', 'merge-base', '--is-ancestor', c, 'HEAD'], capture_output=True).returncode == 0
          args = ['git', 'log', '--no-merges', '--format=%H%x1f%s%x1f%b%x1e']
          args += [f'{prev}..HEAD'] if prev and is_ancestor(prev) else ['-n', '8']
          args += ['--', 'Sources', 'Shared', 'Widgets', 'Info.plist', 'project.yml', 'buildipa.sh', 'assets/icon.png', 'assets/icons']
          out = subprocess.run(args, capture_output=True, text=True).stdout
          lines = []
          other = 0
          for rec in out.split('\x1e'):
              if not rec.strip():
                  continue
              sha, _, rest = rec.strip('\n').partition('\x1f')
              subject, _, body = rest.partition('\x1f')
              if '[skip ci]' in subject or any(sha.startswith(i) for i in ignored):
                  continue
              custom = [l.split(':', 1)[1].strip() for l in body.splitlines() if l.lower().startswith('changelog:')]
              if not custom:
                  other += 1
                  continue
              for item in custom:
                  if item and item not in lines:
                      lines.append(item)
          # 80 lignes et 12 000 caractères au plus (20 lignes avant : la
          # version suivant les séries 17 et 18 en a 66). L'app les fait
          # défiler, le bot Discord les découpe en messages de 2 000
          # caractères ; son brouillon (20 000 au plus) doit tenir.
          MAX, BUDGET = 80, 12000
          items, size = [], 0
          for l in lines:
              if len(items) >= MAX or size + len(l) > BUDGET:
                  break
              items.append(l)
              size += len(l) + 3
          if (other or len(items) < len(lines)) and len(items) < MAX:
              items.append('Other improvements and fixes')
          notes = '\n'.join(f'- {l}' for l in items) or '- Improvements and fixes'
          open('changelog.md', 'w').write(notes + '\n')
          print(notes)
          PY

      - name: Create New Release & Upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          [ "${{ steps.vars.outputs.channel }}" = "test" ] && FLAGS="--prerelease"
          { echo "Automatic build of the \`${{ github.ref_name }}\` branch on ${{ steps.vars.outputs.date }}."; echo; cat changelog.md; } > release-notes.md
          gh release create "${{ steps.vars.outputs.tag }}" build/TwitchUnblock.ipa $FLAGS \
            --title "TwitchUnblock ${{ steps.vars.outputs.version }}$([ "${{ steps.vars.outputs.channel }}" = "test" ] && echo " (test)")" \
            --notes-file release-notes.md

      - name: Update source (apps.json / apps-test.json)
        env:
          SOURCE: ${{ steps.vars.outputs.source }}
          VERSION: ${{ steps.vars.outputs.version }}
          BUILD: ${{ github.run_number }}
          DATE: ${{ steps.vars.outputs.date }}
          URL: ${{ steps.vars.outputs.download_url }}
          COMMIT: ${{ github.sha }}
        run: |
          IPA_SIZE=$(stat -f%z build/TwitchUnblock.ipa || echo "1048576")
          export ENTRY="$RUNNER_TEMP/source-entry.json"
          # L'entrée de ce build (notes, taille, commit), préparée une fois.
          IPA_SIZE=$IPA_SIZE python3 - <<'PY'
          import json, os
          json.dump({
              'version': os.environ['VERSION'], 'buildVersion': os.environ['BUILD'],
              'date': os.environ['DATE'], 'localizedDescription': open('changelog.md').read().strip(),
              'downloadURL': os.environ['URL'], 'size': int(os.environ['IPA_SIZE']),
              'commit': os.environ['COMMIT'],
          }, open(os.environ['ENTRY'], 'w'), ensure_ascii=False)
          PY
          # Chaque build ajoute son entrée à l'historique (30 gardées, de la plus
          # récente à la plus ancienne), avec ses notes : l'app cumule celles des
          # builds qu'il lui manque. La tête de la source reste le build le plus
          # récent, même quand un build plus ancien finit après lui.
          apply() {
            python3 - <<'PY'
          import json, os
          def build(v):
              try: return int(v.get('buildVersion') or 0)
              except ValueError: return 0
          src = os.environ['SOURCE']
          entry = json.load(open(os.environ['ENTRY']))
          d = json.load(open(src))
          a = d['apps'][0]
          versions = [entry] + [v for v in a.get('versions', []) if v.get('buildVersion') != entry['buildVersion']]
          a['versions'] = sorted(versions, key=build, reverse=True)[:30]
          top = a['versions'][0]
          a.update(version=top['version'], versionDate=top['date'], downloadURL=top['downloadURL'], size=top['size'])
          json.dump(d, open(src, 'w'), indent=2, ensure_ascii=False)
          open(src, 'a').write('\n')
          PY
          }
          apply

          # Seules master (apps.json) et la branche de test (apps-test.json)
          # publient leur source ; un build lancé à la main ailleurs s'arrête là.
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "master" ] && [ "$BRANCH" != "test-17d298" ]; then
            echo "Branche $BRANCH : source laissée telle quelle."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Le push peut être rejeté si la branche a bougé pendant le build
          # (source de l'Apple TV, autre build…) : on repart de la branche à
          # jour et on y remet l'entrée. Un rebase butait sur les lignes de tête
          # que l'autre build venait de changer, et la source restait en arrière.
          for attempt in 1 2 3 4; do
            git add "$SOURCE"
            git diff --cached --quiet && exit 0
            git commit -q -m "chore: bump version to $VERSION [skip ci]"
            git push origin HEAD:$BRANCH && exit 0
            sleep $((attempt * 5))
            git fetch -q origin $BRANCH
            git reset -q --hard FETCH_HEAD
            apply
          done
          exit 1

      - name: Mirror test build into the main source (apps.json on master)
        # Une seule source pour tout : apps.json (master) liste aussi « TU Test »
        # (installée à côté de l'app normale), pour essayer les builds de test
        # sans ajouter apps-test.json. Seul ce fichier change sur master, avec
        # [skip ci] ; l'app normale lit toujours apps[0], qui reste la sienne.
        if: github.ref_name == 'test-17d298'
        continue-on-error: true
        run: |
          git fetch origin master
          # Seulement une fois cette étape passée en prod (présente sur master) :
          # avant le « push sur main », la source publique ne bouge pas.
          if ! git show origin/master:.github/workflows/build.yml | grep -q "Mirror test build into the main source"; then
            echo "Étape pas encore sur master : apps.json laissé tel quel."
            exit 0
          fi
          git worktree add --detach ../main-source origin/master
          python3 - <<'PY'
          import json
          test = json.load(open('apps-test.json'))['apps'][0]
          path = '../main-source/apps.json'
          d = json.load(open(path))
          entry = dict(test, versions=test.get('versions', [])[:10])
          d['apps'] = [a for a in d['apps'] if a.get('bundleIdentifier') != entry['bundleIdentifier']] + [entry]
          json.dump(d, open(path, 'w'), indent=2, ensure_ascii=False)
          open(path, 'a').write('\n')
          PY
          cd ../main-source
          git add apps.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: TU Test ${{ steps.vars.outputs.version }} dans la source principale [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master || exit 1
          done
          exit 1
