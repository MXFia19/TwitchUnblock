name: Build and upload nightly

on:
  push:
    branches:
      - master
      # Branche de test : build à part (app « TU Test », release marquée
      # pré-version, source apps-test.json). L'app normale lit apps.json sur
      # master et ne voit donc jamais ces builds.
      - test-17d298
    # Nouvelle version seulement si l'app elle-même change : un README, la
    # source apps.json, auth.html ou le dossier worker ne déclenchent rien.
    paths:
      - 'Sources/**'
      - 'Shared/**'
      - 'Widgets/**'
      - 'Info.plist'
      - 'project.yml'
      - 'VERSION'
      - 'buildipa.sh'
      - 'assets/icon.png'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet : sert à numéroter la version

      - name: Define Release Variables
        id: vars
        run: |
          # Version lisible : « MAJEUR.MINEUR » vient du fichier VERSION (à
          # modifier à la main pour passer à 1.2, 2.0…), le dernier chiffre
          # compte les builds depuis ce changement (commits automatiques
          # « [skip ci] » exclus). Il repart de 0 à chaque nouvelle série au
          # lieu de grimper sans fin (1.0.367). Le numéro de build interne
          # (CFBundleVersion) reste github.run_number : toujours croissant,
          # c'est lui qui sert à détecter une mise à jour.
          BASE=$(tr -d ' \n\r' < VERSION 2>/dev/null || echo "1.0")
          SINCE=$(git log -1 --format=%H -- VERSION)
          if [ -n "$SINCE" ]; then
            # Seuls les commits qui touchent l'app comptent (pas les README…).
            PATCH=$(git rev-list --count "$SINCE"..HEAD -- Sources Shared Widgets Info.plist project.yml buildipa.sh assets/icon.png)
          else
            PATCH=${{ github.run_number }}
          fi
          NEW_VERSION="$BASE.$PATCH"
          if [ "${{ github.ref_name }}" = "master" ]; then
            CHANNEL=stable; TAG_NAME="nightly-${{ github.run_number }}"; SOURCE=apps.json
          else
            CHANNEL=test;   TAG_NAME="test-${{ github.run_number }}";    SOURCE=apps-test.json
          fi
          BUILD_DATE=$(date -u +%Y-%m-%d)
          DOWNLOAD_URL="https://github.com/MXFia19/TwitchUnblock/releases/download/$TAG_NAME/TwitchUnblock.ipa"

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

      - name: Create App Icon Folder
        run: |
          echo "--- Création de l'icône iOS ---"
          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset
          curl -sL https://raw.githubusercontent.com/MXFia19/TwitchUnblock/master/assets/icon.png -o Sources/Assets.xcassets/AppIcon.appiconset/icon.png
          cat <<EOF > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "icon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Inject XcodeGen Settings
        run: |
          echo "--- Préparation du project.yml pour l'icône ---"
          if [ -f "project.yml" ]; then
            # Ancré en fin de ligne : sans `$`, la cible TwitchUnblockWidgets
            # (même début de nom) recevait aussi ces réglages, et son nom.
            sed -i '' "s/PRODUCT_NAME: TwitchUnblock$/PRODUCT_NAME: TwitchUnblock\n        MARKETING_VERSION: ${{ steps.vars.outputs.version }}\n        CURRENT_PROJECT_VERSION: ${{ github.run_number }}\n        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon/g" project.yml
            # Build de test : identifiant à part, installé à côté de l'app normale.
            # L'extension suit : son identifiant doit commencer par celui de l'app.
            if [ "${{ steps.vars.outputs.channel }}" = "test" ]; then
              sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock$/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock.test/" project.yml
              sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock.Widgets$/PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock.test.Widgets/" project.yml
            fi
          fi

      - name: Generate Xcode Project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Post-Generation Fix (Anti-Black Bars, Identity & PiP)
        run: |
          echo "--- Fix Info.plist (Plein écran, ID, Version, PiP) ---"
          # L'Info.plist de l'app seulement. Avant, `find . -name Info.plist`
          # les prenait tous : celui de l'extension des Live Activities aurait
          # reçu l'identifiant de l'app, et iOS refuse alors l'installation.
          APP_PLIST=./Info.plist
          EXT_PLIST=./Widgets/Info.plist
          # Identifiants et version
          if [ "${{ steps.vars.outputs.channel }}" = "test" ]; then
            plutil -replace CFBundleIdentifier -string "com.mxfia19.TwitchUnblock.test" "$APP_PLIST"
            plutil -replace CFBundleDisplayName -string "TU Test" "$APP_PLIST"
          else
            plutil -replace CFBundleIdentifier -string "com.mxfia19.TwitchUnblock" "$APP_PLIST"
          fi
          # Canal lu par l'app : source de mises à jour (apps.json ou apps-test.json).
          plutil -replace TUChannel -string "${{ steps.vars.outputs.channel }}" "$APP_PLIST"
          # Même version pour l'app et son extension (iOS l'exige).
          for P in "$APP_PLIST" "$EXT_PLIST"; do
            plutil -replace CFBundleShortVersionString -string "${{ steps.vars.outputs.version }}" "$P"
            plutil -replace CFBundleVersion -string "${{ github.run_number }}" "$P"
          done
          plutil -replace CFBundleIconName -string "AppIcon" "$APP_PLIST"

          # Force le plein écran sans bandes noires
          plutil -remove UILaunchStoryboardName "$APP_PLIST" || true
          plutil -replace UILaunchScreen -xml "<dict/>" "$APP_PLIST"

          # ✨ RÉPARATION DU PIP ET DE L'AUDIO EN ARRIÈRE-PLAN
          plutil -replace UIBackgroundModes -json '["audio","fetch"]' "$APP_PLIST"

      - name: Make build script executable
        run: chmod +x ./buildipa.sh

      - name: Build iOS IPA
        run: ./buildipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwitchUnblock-Nightly-IPA
          path: build/TwitchUnblock.ipa

      - name: Changelog since previous build
        env:
          SOURCE: ${{ steps.vars.outputs.source }}
        run: |
          # Notes de version : les commits qui touchent l'app depuis le build
          # précédent de ce canal (commit gardé dans la source). Une ligne
          # « Changelog: … » dans le corps d'un commit remplace son titre ;
          # les commits automatiques « [skip ci] » sont ignorés, ainsi que ceux
          # listés dans .github/changelog-ignore (une fonction ajoutée puis
          # retirée ne doit pas être annoncée).
          python3 - <<'PY'
          import json, os, subprocess
          src = os.environ['SOURCE']
          prev = None
          try:
              prev = json.load(open(src))['apps'][0]['versions'][0].get('commit')
          except Exception:
              pass
          ignored = []
          try:
              ignored = [l.split()[0] for l in open('.github/changelog-ignore')
                         if l.strip() and not l.lstrip().startswith('#')]
          except FileNotFoundError:
              pass
          def is_ancestor(c):
              return subprocess.run(['git', 'merge-base', '--is-ancestor', c, 'HEAD'], capture_output=True).returncode == 0
          args = ['git', 'log', '--no-merges', '--format=%H%x1f%s%x1f%b%x1e']
          args += [f'{prev}..HEAD'] if prev and is_ancestor(prev) else ['-n', '8']
          args += ['--', 'Sources', 'Shared', 'Widgets', 'Info.plist', 'project.yml', 'buildipa.sh', 'assets/icon.png']
          out = subprocess.run(args, capture_output=True, text=True).stdout
          lines = []
          for rec in out.split('\x1e'):
              if not rec.strip():
                  continue
              sha, _, rest = rec.strip('\n').partition('\x1f')
              subject, _, body = rest.partition('\x1f')
              if '[skip ci]' in subject or any(sha.startswith(i) for i in ignored):
                  continue
              custom = [l.split(':', 1)[1].strip() for l in body.splitlines() if l.lower().startswith('changelog:')]
              for item in (custom or [subject.strip()]):
                  if item and item not in lines:
                      lines.append(item)
          notes = '\n'.join(f'- {l}' for l in lines[:15]) or '- Améliorations et corrections'
          open('changelog.md', 'w').write(notes + '\n')
          print(notes)
          PY

      - name: Create New Release & Upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          [ "${{ steps.vars.outputs.channel }}" = "test" ] && FLAGS="--prerelease"
          { echo "Build automatique de la branche \`${{ github.ref_name }}\` le ${{ steps.vars.outputs.date }}."; echo; cat changelog.md; } > release-notes.md
          gh release create "${{ steps.vars.outputs.tag }}" build/TwitchUnblock.ipa $FLAGS \
            --title "TwitchUnblock ${{ steps.vars.outputs.version }}$([ "${{ steps.vars.outputs.channel }}" = "test" ] && echo " (test)")" \
            --notes-file release-notes.md

      - name: Update source (apps.json / apps-test.json)
        env:
          SOURCE: ${{ steps.vars.outputs.source }}
          VERSION: ${{ steps.vars.outputs.version }}
          BUILD: ${{ github.run_number }}
          DATE: ${{ steps.vars.outputs.date }}
          URL: ${{ steps.vars.outputs.download_url }}
        run: |
          IPA_SIZE=$(stat -f%z build/TwitchUnblock.ipa || echo "1048576")
          # Chaque build ajoute une entrée en tête de l'historique (30 gardées),
          # avec ses notes : l'app cumule celles des builds qu'il lui manque.
          IPA_SIZE=$IPA_SIZE python3 - <<'PY'
          import json, os, subprocess
          src = os.environ['SOURCE']
          d = json.load(open(src))
          a = d['apps'][0]
          entry = {
              'version': os.environ['VERSION'], 'buildVersion': os.environ['BUILD'],
              'date': os.environ['DATE'], 'localizedDescription': open('changelog.md').read().strip(),
              'downloadURL': os.environ['URL'], 'size': int(os.environ['IPA_SIZE']),
              'commit': subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, text=True).stdout.strip(),
          }
          a.update(version=entry['version'], versionDate=entry['date'], downloadURL=entry['downloadURL'], size=entry['size'])
          a['versions'] = [entry] + [v for v in a.get('versions', []) if v.get('buildVersion') != entry['buildVersion']][:29]
          json.dump(d, open(src, 'w'), indent=2, ensure_ascii=False)
          open(src, 'a').write('\n')
          PY

          # Seules master (apps.json) et la branche de test (apps-test.json)
          # publient leur source ; un build lancé à la main ailleurs s'arrête là.
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "master" ] && [ "$BRANCH" != "test-17d298" ]; then
            echo "Branche $BRANCH : source laissée telle quelle."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$SOURCE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to ${{ steps.vars.outputs.version }} [skip ci]"
            # Le push peut être rejeté si la branche a bougé pendant le build :
            # on rejoue par-dessus au lieu d'échouer sur une course bénigne.
            git push origin HEAD:$BRANCH || {
              git pull --rebase origin $BRANCH && git push origin HEAD:$BRANCH
            }
          fi
