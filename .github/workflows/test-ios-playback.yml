name: iOS playback geometry regression
on: workflow_dispatch
permissions:
  contents: read
jobs:
  playback:
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build small app using the production video surface
        run: |
          mkdir -p /tmp/PlaybackProbe.app
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          source = Path('Sources/Views/Player/ImmersivePlayer.swift').read_text()
          start = source.index('final class PlayerLayerUIView:')
          end = source.index('/// Surface vidéo du lecteur immersif', start)
          Path('/tmp/PlayerSurface.swift').write_text('import SwiftUI\nimport AVFoundation\n' + source[start:end])
          info = dict(CFBundleIdentifier='dev.twitchunblock.playbackprobe', CFBundleExecutable='PlaybackProbe',
                      CFBundleName='PlaybackProbe', CFBundlePackageType='APPL', CFBundleVersion='1',
                      CFBundleShortVersionString='1.0', MinimumOSVersion='16.0', LSRequiresIPhoneOS=True,
                      UILaunchScreen={}, UISupportedInterfaceOrientations=['UIInterfaceOrientationPortrait'])
          Path('/tmp/PlaybackProbe.app/Info.plist').write_bytes(plistlib.dumps(info))
          PY
          swiftc -swift-version 5 -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target x86_64-apple-ios16.0-simulator \
            Sources/Services/PlayerLayerGeometry.swift Sources/Services/TwitchAdPlaylist.swift \
            Sources/Services/LivePlaylistLoader.swift Sources/Services/AdBreakMonitor.swift \
            Tests/LivePlaylistAppleSupport.swift /tmp/PlayerSurface.swift \
            Tests/NativePlayback/iOSPlayback.swift -o /tmp/PlaybackProbe.app/PlaybackProbe
          codesign --force --sign - /tmp/PlaybackProbe.app
      - name: Boot iPhone and trust the fixture certificate
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          sim_udid=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/simulators.json'))['devices']
          key=sorted(k for k in data if '.iOS-' in k)[-1]
          print(next(d['udid'] for d in data[key] if d['name'].startswith('iPhone')))
          PY
          )
          echo "SIM_UDID=$sim_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$sim_udid"
          xcrun simctl bootstatus "$sim_udid" -b
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -addext 'extendedKeyUsage=serverAuth' \
            -keyout /tmp/fixture.key -out /tmp/fixture.crt
          xcrun simctl keychain "$sim_udid" add-root-cert /tmp/fixture.crt
          xcrun simctl install "$sim_udid" /tmp/PlaybackProbe.app
      - name: Check displayed frame proportions during the ad gap
        env:
          FIXTURE_CERT: /tmp/fixture.crt
          FIXTURE_KEY: /tmp/fixture.key
        run: |
          python3 -u Tests/NativePlayback/server.py &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ready=0
          for attempt in {1..30}; do
            kill -0 "$server_pid"
            if curl --silent --fail --max-time 2 --cacert /tmp/fixture.crt https://127.0.0.1:8765/health --output /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          xcrun simctl launch "$SIM_UDID" dev.twitchunblock.playbackprobe
          app_data=$(xcrun simctl get_app_container "$SIM_UDID" dev.twitchunblock.playbackprobe data)
          for attempt in {1..90}; do
            if test -f "$app_data/Documents/result.json"; then break; fi
            sleep 1
          done
          mkdir -p /tmp/ios-playback-results
          cp "$app_data/Documents/result.json" /tmp/ios-playback-results/result.json
          xcrun simctl io "$SIM_UDID" screenshot /tmp/ios-playback-results/screen.png
          cat /tmp/ios-playback-results/result.json
          python3 -c 'import json; assert json.load(open("/tmp/ios-playback-results/result.json"))["ok"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-playback-results
          path: /tmp/ios-playback-results
          retention-days: 3
