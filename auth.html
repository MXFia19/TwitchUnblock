<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TwitchUnblock Auth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #0e0e10; color: #efeff1; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; text-align: center; }
    .box { padding: 20px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    p { color: #888; font-size: 14px; }
  </style>
</head>
<body>
<div class="box">
  <div class="icon">🟣</div>
  <h2 id="status">Connexion en cours...</h2>
  <p id="sub">Retourne dans l'application</p>
</div>
<script>
  // Récupérer le token depuis le fragment (#access_token=...)
  const raw = (window.location.hash || window.location.search).replace(/^[#?]/, '');
  const params = new URLSearchParams(raw);
  const token = params.get('access_token');

  // Jeton Twitch : lettres et chiffres uniquement. Le state est renvoyé tel
  // quel à l'app, qui vérifie qu'il correspond à sa demande.
  if (token && /^[a-z0-9]+$/i.test(token)) {
    const state = params.get('state') || '';
    const deepLink = 'twitchunblock://auth?access_token=' + encodeURIComponent(token) +
      (state ? '&state=' + encodeURIComponent(state) : '');
    window.location.href = deepLink;

    document.getElementById('status').textContent = '✅ Connecté !';
    document.getElementById('sub').textContent = 'Retourne dans TwitchUnblock';
  } else {
    const error = params.get('error_description') || params.get('error') || 'Inconnu';
    document.getElementById('status').textContent = '❌ Erreur';
    document.getElementById('sub').textContent = 'Erreur: ' + error;
  }
</script>
</body>
</html>
