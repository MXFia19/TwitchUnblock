name: TwitchUnblock

options:
  bundleIdPrefix: com.mxfia19
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    SUPPORTS_MACCATALYST: NO

targets:
  TwitchUnblock:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: Sources
      # Type de la Live Activity, compilé aussi dans l'extension.
      - path: Shared

    # Extension des Live Activities, copiée dans l'app (PlugIns).
    dependencies:
      - target: TwitchUnblockWidgets
        codeSign: false

    # Pas de bloc `info:` : xcodegen réécrirait Info.plist avec un fichier
    # minimal et ferait disparaître nos clés (tâche d'arrière-plan des
    # notifications, schémas canOpenURL, liens twitchunblock://…).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock
        PRODUCT_NAME: TwitchUnblock
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""
        # ActivityKit n'existe qu'à partir d'iOS 16.1 : lien faible, sinon
        # l'app ne se lancerait plus du tout sur iOS 16.0.
        OTHER_LDFLAGS: "$(inherited) -weak_framework ActivityKit"

  # App Apple TV (premier jet, branche de test) : même récupération des
  # lives et des VODs que l'iPhone (fichiers partagés ci-dessous, sans
  # WebKit ni UIKit propre à l'iPhone), interface à la télécommande dans TV/.
  # Construite à part (build-tvos.yml) : un échec ici ne bloque pas l'iPhone.
  TwitchUnblockTV:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"

    sources:
      - path: TV
        excludes:
          - Info.plist
          - make_tv_icons.py
      - path: Sources/Constants.swift
      - path: Sources/Theme.swift
      - path: Sources/Models.swift
      - path: Sources/Localization/RussianStrings.swift
      - path: Sources/Localization/JapaneseStrings.swift
      - path: Sources/Services/Logger.swift
      - path: Sources/Services/Keychain.swift
      - path: Sources/Services/TopLanguage.swift
      - path: Sources/Services/TwitchAPI.swift
      - path: Sources/Services/LivePlaylistLoader.swift
      - path: Sources/Services/VodUnmute.swift
      # Pauses pub du direct : VodUnmuteLoader.playerItem y fait appel.
      - path: Sources/Services/AdBreakMonitor.swift
      - path: Sources/Services/SpatialAudio.swift
      - path: Sources/Services/HiddenContent.swift
      # Reprise après une interruption du son (Siri, FaceTime) : TVPlayer.
      - path: Sources/Services/PlaybackAudio.swift
      - path: Sources/Services/PlaybackDiagnostics.swift
      # Journal traduit (section « Erreurs récentes » du Compte).
      - path: Sources/Services/LogTranslations.swift

    # Signature automatique : en local, il suffit de choisir son équipe dans
    # Xcode. La CI construit sans signer (réglages passés à xcodebuild).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblockTV
        PRODUCT_NAME: TwitchUnblockTV
        # Icône en calques et images « Top Shelf » (TV/make_tv_icons.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        INFOPLIST_FILE: TV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic

  # Live Activity du lecteur (écran verrouillé, Dynamic Island). iOS 16.2
  # minimum : l'app, elle, reste en 16.0 et s'en passe en dessous.
  TwitchUnblockWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"

    sources:
      - path: Widgets
        excludes:
          - Info.plist
      - path: Shared

    settings:
      base:
        # Doit commencer par l'identifiant de l'app (la CI ajoute « .test »
        # aux deux pour le build de test).
        PRODUCT_BUNDLE_IDENTIFIER: com.mxfia19.TwitchUnblock.Widgets
        PRODUCT_NAME: TwitchUnblockWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: 5.9
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""
        DEVELOPMENT_TEAM: ""
